[package]
name = "ai-room-desktop"
version = "0.1.0"
description = "PROJECT AI ROOM cloud-only desktop shell (Windows 11 x64)"
authors = ["PROJECT AI ROOM"]
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"
publish = false

# Tauri가 요구하는 lib 형태. main.rs는 얇은 진입점이고 로직은 lib에 있다(테스트 가능).
[lib]
name = "ai_room_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 실행 파일 이름은 tauri.conf.json의 productName("AI ROOM")과 맞춘다.
# 카고 패키지 이름은 공백을 쓸 수 없어서 바이너리 타깃 이름을 따로 지정한다.
# (CI는 target/release/AI ROOM.exe 를 아티팩트로 수집한다)
[[bin]]
name = "AI ROOM"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
# 데스크톱 셸 자체. 정확한 버전 고정: CI가 다른 minor를 조용히 끌어오지 않게 한다.
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# URL 정책·정규화는 url 크레이트로 직접 다룬다(tauri가 쓰는 것과 같은 계열).
url = "2"
tokio = { version = "1", features = ["time"] }
# 서버 연결 확인은 웹뷰가 아니라 Rust 쪽에서 한다(CORS·혼합 콘텐츠 영향을 받지 않게).
# rustls 사용: Windows에서 OpenSSL 빌드 의존성을 만들지 않는다.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }

# 릴리스 빌드 최적화(설치 파일 크기). 동작에는 영향 없음.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
