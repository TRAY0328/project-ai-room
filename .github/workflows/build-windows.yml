# Windows 11 x64 : EXE + NSIS 설치 프로그램 + MSI
# 시크릿을 쓰지 않는다(빌드 환경에 Cloudflare 프로덕션 비밀을 두지 않는다, 명세 14.4).
# 서명 인증서가 없으므로 결과물은 미서명이며 SmartScreen 경고를 숨기지 않는다.
name: build-windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: rust toolchain (1.100.0, msvc x64)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # dtolnay/rust-toolchain@v1
        with:
          # 러스트 버전을 고정한다 — rustfmt 결과가 도구 버전에 따라 달라져
          # `cargo fmt --check`가 이유 없이 깨지는 일을 막는다.
          toolchain: 1.100.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: setup node (22.20.0, npm cache for desktop)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: install tauri cli (lockfile only)
        run: npm ci --prefix apps/desktop

      - name: cargo fmt check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: cargo test (url policy, settings, probe)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: build EXE + NSIS + MSI (Tauri)
        run: npm --prefix apps/desktop run tauri build

      - name: collect artifacts, checksums, build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "apps/desktop/src-tauri/target/release"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts/windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Join-Path $root "AI ROOM.exe"
          if (-not (Test-Path $exe)) { throw "EXE not found at $exe — refusing to report success" }
          Copy-Item $exe $out

          $bundles = Get-ChildItem -Path (Join-Path $root "bundle") -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".exe", ".msi" -and $_.Name -ne "AI ROOM.exe" }
          if (-not $bundles) { throw "No installer produced (bundle dir empty) — refusing to report success" }
          foreach ($file in $bundles) { Copy-Item $file.FullName (Join-Path $out $file.Name) }

          $rows = Get-ChildItem -Path $out -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          }
          $rows | Set-Content -Path (Join-Path $out "SHA256SUMS.txt") -Encoding ascii

          $manifest = [ordered]@{
            schema_version = 1
            platform = "windows-x64"
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            built_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            signing = "unsigned — 코드 서명 인증서 없음(SmartScreen 경고 발생)"
            verification_status = "BUILT_UNVERIFIED"
            files = @(Get-ChildItem -Path $out -File | Where-Object { $_.Name -ne "build-info.json" } | ForEach-Object {
              [ordered]@{
                filename = $_.Name
                size_bytes = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            })
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $out "build-info.json") -Encoding utf8

          Get-Content (Join-Path $out "SHA256SUMS.txt")
          Get-ChildItem $out -File | Select-Object Name, Length

      - name: upload artifact (EXE + installers + checksums)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/windows-x64
          retention-days: 14
          if-no-files-found: error
